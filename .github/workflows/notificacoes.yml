name: Notificações automáticas

on:
  schedule:
    # Todo dia às 09:17 de Brasília (12:17 UTC)
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só simular (não envia nada)'
        type: boolean
        default: true
      dados_teste:
        description: 'Usar dados de teste (coleções debug_)'
        type: boolean
        default: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock nodemailer@6.9.16
      - run: node scripts/notificar.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular && 'true' || 'false' }}
          PREFIXO: ${{ github.event_name == 'workflow_dispatch' && inputs.dados_teste && 'debug_' || '' }}
